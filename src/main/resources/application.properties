spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# database level chache
# Optimize for caching

# 1. batch_size=50
# "Group database writes into batches of 50"

# Instead of: INSERT..., INSERT..., INSERT... (50 separate trips)

# Do: INSERT..., ..., ... (50 inserts in 1 trip)

# Use for: Bulk inserts/updates (saveAll(), deleteInBatch())

# 2. fetch_size=100
# "Fetch query results in chunks of 100 rows"

# Instead of: Load 10,000 rows all at once into memory

# Do: Load 100 rows, then next 100, then next...

# Use for: Large result sets (findAll(), reports)

# 3. default_batch_fetch_size=100
# "Fix N+1 queries by loading related data in batches"

# Instead of: Query user 1, user 2, user 3... (50 separate queries)

# Do: Query users WHERE id IN (1, 2, 3... up to 100) (1 query)

# Use for: LAZY loading relationships (todo.getUser())

# Good for bulk operations (saveAll(), deleteInBatch)
# Reducing network trips (batch_size)
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Good for your cursor pagination (loading pages)
# Managing memory better (fetch_size)
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Good for LAZY loading users in todos
# Fixing N+1 query problems (default_batch_fetch_size)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
